name = "scholarmap"
main = "api/cf-worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ── Custom Domain ──
# scholarmap.io is already purchased on Cloudflare
# These routes auto-connect the Worker to your domain.
# Temporarily disabled to deploy to the *.workers.dev subdomain first.
# Re-enable once the scholarmap.io zone is added to this Cloudflare account.
# [[routes]]
# pattern = "scholarmap.io"
# custom_domain = true

# [[routes]]
# pattern = "www.scholarmap.io"
# custom_domain = true

workers_dev = true

# ── D1 Database ──
# Create: npx wrangler d1 create scholarmap-db
# Then replace database_id below with the real ID
[[d1_databases]]
binding = "DB"
database_name = "scholarmap-db"
database_id = "9a9ab3e1-4e76-4400-a6ec-df6c996b9450"

# ── Workers AI (embeddings + literature synthesis) ──
# Free-tier daily allocation covers MVP traffic.
# - bge-m3 embeddings: paper.searchLive semantic rerank
# - Llama 3.1 8B fp8: synthesis.generate cited summaries
# Both degrade cleanly when the binding is unavailable.
[ai]
binding = "AI"

# ── Environment Variables ──
[vars]
APP_URL = "https://scholarmap.io"
KIMI_AUTH_URL = "https://api.kimi.moonshot.cn"

# ── Secrets (set via: npx wrangler secret put <NAME>) ──
# KIMI_CLIENT_ID
# KIMI_CLIENT_SECRET  
# SESSION_SECRET
# JWT_SECRET
# LEMONSQUEEZY_API_KEY
# LEMONSQUEEZY_STORE_ID
# LEMONSQUEEZY_PRO_VARIANT_ID
# LEMONSQUEEZY_PRO_YEARLY_VARIANT_ID
# LEMONSQUEEZY_WEBHOOK_SECRET

# ── Build ──
[build]
command = "npm run build:cf"

# ── Static Assets (Workers Assets binding) ──
[assets]
directory = "./dist/public"
binding = "ASSETS"

# ── Preview environment (PR deployments) ──
[env.preview]
name = "scholarmap-preview"
workers_dev = true

[env.preview.vars]
APP_URL = "https://scholarmap-preview.workers.dev"
KIMI_AUTH_URL = "https://api.kimi.moonshot.cn"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "scholarmap-db"
database_id = "9a9ab3e1-4e76-4400-a6ec-df6c996b9450"

[env.preview.ai]
binding = "AI"
