name = "scholarmap"
main = "api/cf-worker.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# ── Custom Domain ──
# The scholarmap.io zone lives in this Cloudflare account; these routes
# auto-connect the Worker to the apex and www hosts on deploy.
[[routes]]
pattern = "scholarmap.io"
custom_domain = true

[[routes]]
pattern = "www.scholarmap.io"
custom_domain = true

workers_dev = true

# ── D1 Database ──
# Create: npx wrangler d1 create scholarmap-db
# Then replace database_id below with the real ID
[[d1_databases]]
binding = "DB"
database_name = "scholarmap-db"
database_id = "9a9ab3e1-4e76-4400-a6ec-df6c996b9450"

# ── Environment Variables ──
[vars]
APP_URL = "https://scholarmap.io"
KIMI_AUTH_URL = "https://api.kimi.moonshot.cn"

# ── Secrets (set via: npx wrangler secret put <NAME>) ──
# KIMI_CLIENT_ID
# KIMI_CLIENT_SECRET  
# SESSION_SECRET
# JWT_SECRET
# LEMONSQUEEZY_API_KEY
# LEMONSQUEEZY_STORE_ID
# LEMONSQUEEZY_PRO_VARIANT_ID
# LEMONSQUEEZY_PRO_YEARLY_VARIANT_ID
# LEMONSQUEEZY_WEBHOOK_SECRET

# ── Build ──
[build]
command = "npm run build:cf"

# ── Static Assets (Workers Assets binding) ──
[assets]
directory = "./dist/public"
binding = "ASSETS"

# ── Preview environment (PR deployments) ──
[env.preview]
name = "scholarmap-preview"
workers_dev = true

[env.preview.vars]
APP_URL = "https://scholarmap-preview.workers.dev"
KIMI_AUTH_URL = "https://api.kimi.moonshot.cn"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "scholarmap-db"
database_id = "9a9ab3e1-4e76-4400-a6ec-df6c996b9450"
