name: CI

# Deployment is handled by Cloudflare Workers Builds (native Git integration),
# so this workflow needs no Cloudflare secrets — it only verifies the code.
on:
  push:
    branches: [main, cf]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    name: Lint, Typecheck, Test & Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build for Cloudflare
        run: npm run build:cf
